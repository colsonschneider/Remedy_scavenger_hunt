<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1b1f" />
  <title>05 · Caesar's Secret</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/remedy-r.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>

  <main class="clue-page">
    <a href="index.html" class="back-link">← Back to clues</a>

    <div class="clue-header">
      <div class="clue-number-large">Clue 05 of 30</div>
      <h1>Caesar's Secret</h1>
      <span class="clue-type-pill" style="color: #A4B54B; border: 1px solid #A4B54B66; background: #A4B54B1a;">Cipher Decoder</span>
    </div>

    
    <div class="puzzle-box">
      <h2 style="text-align: center;">Decode the Caesar cipher</h2>
      <p style="text-align: center;">Each letter has been shifted. Rotate the dial until it reads.</p>
      <div class="cipher-text" id="cipherText"></div>
      <div class="shift-control">
        <button id="shiftDown" type="button">−</button>
        <div class="shift-val"><small>Shift</small><span id="shiftVal">0</span></div>
        <button id="shiftUp" type="button">+</button>
      </div>
      <div class="answer-row">
        <input type="text" id="answerInput" class="text-input" placeholder="Decoded message..." autocomplete="off" />
        <button class="btn btn-orange" id="checkBtn" type="button">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    

    <button class="solve-btn" id="solveBtn" type="button">I solved it ✓</button>
  </main>

  <script src="script.js"></script>
  <script>
    const CLUE_NUM = 5;
    const ANSWER = "SHELDON CHUMIR";
    const LOCATION = "Sheldon M. Chumir Health Centre";

    // If no team is set, route home
    if (!window.REMEDY.getTeam()) {
      window.location.href = "index.html";
    }

    const solveBtn = document.getElementById("solveBtn");
    async function refreshSolve() {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) {
        solveBtn.textContent = "Solved ✓ (tap to undo)";
        solveBtn.classList.add("solved");
      } else {
        solveBtn.textContent = "I solved it ✓";
        solveBtn.classList.remove("solved");
      }
    }
    solveBtn.addEventListener("click", async () => {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) solved.delete(CLUE_NUM);
      else solved.add(CLUE_NUM);
      solveBtn.textContent = "Saving…";
      await window.REMEDY.saveProgress(solved);
      refreshSolve();
    });

    // Sync state from server on load (so multiple devices stay in sync)
    (async () => {
      await window.REMEDY.fetchProgress();
      refreshSolve();
    })();
    refreshSolve();

    // Puzzle-specific code
    
    const ANSWER = ("SHELDON CHUMIR").toUpperCase();
    const SHIFT_USED = 7;
    function shift(s, k) {
      return s.split("").map(ch => { const code = ch.charCodeAt(0); if (code >= 65 && code <= 90) return String.fromCharCode((code - 65 + k + 26) % 26 + 65); return ch; }).join("");
    }
    const ENCRYPTED = shift(ANSWER, SHIFT_USED);
    const cipherText = document.getElementById("cipherText");
    const shiftValEl = document.getElementById("shiftVal");
    const input = document.getElementById("answerInput");
    const feedback = document.getElementById("feedback");
    let currentShift = 0;
    function render() { cipherText.textContent = shift(ENCRYPTED, -currentShift); shiftValEl.textContent = currentShift; }
    document.getElementById("shiftUp").addEventListener("click", () => { currentShift = (currentShift + 1) % 26; render(); });
    document.getElementById("shiftDown").addEventListener("click", () => { currentShift = (currentShift - 1 + 26) % 26; render(); });
    document.getElementById("checkBtn").addEventListener("click", () => {
      const norm = s => s.replace(/[^A-Za-z0-9]/g, "").toLowerCase();
      if (norm(input.value) === norm(ANSWER)) { feedback.className = "feedback show correct"; feedback.textContent = `Correct! Head to ${"Sheldon M. Chumir Health Centre"}.`; }
      else { feedback.className = "feedback show wrong"; feedback.textContent = "Not yet — keep adjusting the shift."; }
    });
    input.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("checkBtn").click(); });
    render();

  </script>
</body>
</html>
