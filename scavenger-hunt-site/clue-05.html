<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#414042" />
  <title>Clue 05 — Caesar's Secret</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/remedy-r.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>

  <main class="clue-page">
    <a href="#" id="backLink" class="back-link">← Back to your team</a>

    <div class="clue-header">
      <div class="clue-number-large">Clue 05 of 30</div>
      <h1>Caesar's Secret</h1>
      <span class="clue-type-pill" style="color: #A4B54B; border: 1px solid #A4B54B66; background: #A4B54B1a;">Cipher Decoder</span>
    </div>

    
    <div class="puzzle-box">
      <h2 style="text-align: center;">Decrypt the Caesar cipher</h2>
      <p style="text-align: center;">Each letter has been shifted by the same amount. Rotate the dial below until the message becomes readable.</p>
      <div class="cipher-text" id="cipherText"></div>
      <div class="shift-control">
        <button id="shiftDown" type="button">−</button>
        <div class="shift-val"><span style="font-size: 0.75rem; color: var(--text-dim);">Shift</span><br/><span id="shiftVal">0</span></div>
        <button id="shiftUp" type="button">+</button>
      </div>
      <div class="answer-row">
        <input type="text" id="answerInput" class="text-input" placeholder="Type the decoded message..." autocomplete="off" />
        <button class="btn btn-primary" id="checkBtn" type="button">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    

    <div class="photo-box" id="photoBox" style="display: none;">
      <h3>📸 Photo proof required</h3>
      <p>Take a team photo at <strong id="locationName"></strong> to claim the clue.</p>
      <label class="upload-btn" for="photoInput">Upload team photo</label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" />
      <img class="photo-preview" id="photoPreview" alt="Your team photo" />
    </div>

    <button class="solve-btn" id="solveBtn" type="button">I solved it ✓</button>
  </main>

  <script src="script.js"></script>
  <script>
    const CLUE_NUM = 5;
    const ANSWER = "SUNNYSIDE STATION";
    const LOCATION = "Sunnyside Station";

    // back link points at the team's page
    const teamInfo = window.REMEDY.getTeamInfo();
    const backLink = document.getElementById("backLink");
    if (teamInfo) { backLink.href = teamInfo.url; backLink.textContent = `← Back to ${teamInfo.name}`; }
    else { backLink.href = "index.html"; backLink.textContent = "← Choose your team"; }

    const photoBox = document.getElementById("photoBox");
    const photoInput = document.getElementById("photoInput");
    const photoPreview = document.getElementById("photoPreview");
    const locationName = document.getElementById("locationName");

    function revealLocation() {
      locationName.textContent = LOCATION;
      photoBox.style.display = "block";
    }

    function loadPhoto() {
      const team = window.REMEDY.getTeam();
      const data = localStorage.getItem(window.REMEDY.photoKey(team, CLUE_NUM));
      if (data) {
        photoPreview.src = data;
        photoPreview.classList.add("show");
      }
    }

    photoInput.addEventListener("change", e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = ev => {
        photoPreview.src = ev.target.result;
        photoPreview.classList.add("show");
        try {
          const team = window.REMEDY.getTeam();
          localStorage.setItem(window.REMEDY.photoKey(team, CLUE_NUM), ev.target.result);
        } catch (err) {
          console.warn("Photo too large to save locally:", err);
        }
      };
      reader.readAsDataURL(f);
    });

    // Solve button
    const solveBtn = document.getElementById("solveBtn");
    function refreshSolve() {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) {
        solveBtn.textContent = "Solved ✓ (tap to undo)";
        solveBtn.classList.add("solved");
      } else {
        solveBtn.textContent = "I solved it ✓";
        solveBtn.classList.remove("solved");
      }
    }
    solveBtn.addEventListener("click", () => {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) solved.delete(CLUE_NUM);
      else solved.add(CLUE_NUM);
      window.REMEDY.saveProgress(solved);
      refreshSolve();
    });

    // Photo persistence
    loadPhoto();
    refreshSolve();

    // Puzzle-specific logic
    
    const ANSWER = "SUNNYSIDE STATION".toUpperCase();
    // Encrypt the answer with shift 7 to display
    const SHIFT_USED = 7;
    function shift(s, k) {
      return s.split("").map(ch => {
        const code = ch.charCodeAt(0);
        if (code >= 65 && code <= 90) return String.fromCharCode((code - 65 + k + 26) % 26 + 65);
        return ch;
      }).join("");
    }
    const ENCRYPTED = shift(ANSWER, SHIFT_USED);
    const cipherText = document.getElementById("cipherText");
    const shiftValEl = document.getElementById("shiftVal");
    const input = document.getElementById("answerInput");
    const feedback = document.getElementById("feedback");
    let currentShift = 0;
    function render() {
      cipherText.textContent = shift(ENCRYPTED, -currentShift);
      shiftValEl.textContent = currentShift;
    }
    document.getElementById("shiftUp").addEventListener("click", () => { currentShift = (currentShift + 1) % 26; render(); });
    document.getElementById("shiftDown").addEventListener("click", () => { currentShift = (currentShift - 1 + 26) % 26; render(); });
    document.getElementById("checkBtn").addEventListener("click", () => {
      const norm = s => s.replace(/[^A-Za-z0-9]/g, "").toLowerCase();
      if (norm(input.value) === norm(ANSWER)) {
        feedback.className = "feedback show correct";
        feedback.textContent = `Correct! Head to ${"Sunnyside Station"} and snap a team photo.`;
        revealLocation();
      } else {
        feedback.className = "feedback show wrong";
        feedback.textContent = "Not yet — keep adjusting the shift.";
      }
    });
    input.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("checkBtn").click(); });
    render();

  </script>
</body>
</html>
