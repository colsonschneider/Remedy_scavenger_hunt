<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1b1f" />
  <title>21 · Buzzer Beater</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/remedy-r.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>

  <main class="clue-page">
    <a href="index.html" class="back-link">← Back to clues</a>

    <div class="clue-header">
      <div class="clue-number-large">Clue 21 of 30</div>
      <h1>Buzzer Beater</h1>
      <span class="clue-type-pill" style="color: #ff6b9a; border: 1px solid #ff6b9a66; background: #ff6b9a1a;">Speed Trivia</span>
    </div>

    
    <div class="puzzle-box center">
      <div class="placeholder-icon">⚡</div>
      <h2>Speed Trivia</h2>
      <p>Beat the clock.</p>
      <p style="margin-top: 14px; font-size: 0.82rem; color: var(--orange);">
        <em>Demo placeholder — puzzle to be built before the event.</em>
      </p>
      <div class="feedback" id="feedback"></div>
    </div>


    <button class="solve-btn" id="solveBtn" type="button">I solved it ✓</button>
  </main>

  <script src="script.js"></script>
  <script>
    const CLUE_NUM = 21;
    const ANSWER = "Wurst";
    const LOCATION = "Wurst (German beer hall)";

    // If no team is set, route home
    if (!window.REMEDY.getTeam()) {
      window.location.href = "index.html";
    }

    const solveBtn = document.getElementById("solveBtn");
    async function refreshSolve() {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) {
        solveBtn.textContent = "Solved ✓ (tap to undo)";
        solveBtn.classList.add("solved");
      } else {
        solveBtn.textContent = "I solved it ✓";
        solveBtn.classList.remove("solved");
      }
    }
    solveBtn.addEventListener("click", async () => {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) solved.delete(CLUE_NUM);
      else solved.add(CLUE_NUM);
      solveBtn.textContent = "Saving…";
      await window.REMEDY.saveProgress(solved);
      refreshSolve();
    });

    // Sync state from server on load (so multiple devices stay in sync)
    (async () => {
      await window.REMEDY.fetchProgress();
      refreshSolve();
    })();
    refreshSolve();

    // Puzzle-specific code
    
    const feedback = document.getElementById("feedback");
    if (feedback) {
      feedback.className = "feedback show";
      feedback.style.background = "#fff3e0"; feedback.style.color = "#8a4a14"; feedback.style.border = "1px solid #ffd6a3";
      feedback.textContent = `Demo placeholder for ${"Wurst (German beer hall)"}. Tap "I solved it" to mark this clue done.`;
    }

  </script>
</body>
</html>
