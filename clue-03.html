<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1b1f" />
  <title>03 · Find the Threads</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/remedy-r.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>

  <main class="clue-page">
    <a href="index.html" class="back-link">← Back to clues</a>

    <div class="clue-header">
      <div class="clue-number-large">Clue 03 of 30</div>
      <h1>Find the Threads</h1>
      <span class="clue-type-pill" style="color: #c8a6ff; border: 1px solid #c8a6ff66; background: #c8a6ff1a;">Connections</span>
    </div>

    
    <div class="puzzle-box">
      <h2 style="text-align: center;">Find four groups of four</h2>
      <p style="text-align: center;">Tap 4 tiles you think share a theme, then hit Submit.</p>
      <div class="connections-grid" id="connGrid"></div>
      <div id="connStatus" style="text-align: center; margin-top: 8px; font-size: 0.85rem; color: var(--text-dim);"></div>
      <div class="conn-controls">
        <button class="btn btn-ghost" id="connClear" type="button">Clear</button>
        <button class="btn btn-orange" id="connSubmit" type="button">Submit</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    

    <button class="solve-btn" id="solveBtn" type="button">I solved it ✓</button>
  </main>

  <script src="script.js"></script>
  <script>
    const CLUE_NUM = 3;
    const ANSWER = "Lougheed House";
    const LOCATION = "Lougheed House";

    // If no team is set, route home
    if (!window.REMEDY.getTeam()) {
      window.location.href = "index.html";
    }

    const solveBtn = document.getElementById("solveBtn");
    async function refreshSolve() {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) {
        solveBtn.textContent = "Solved ✓ (tap to undo)";
        solveBtn.classList.add("solved");
      } else {
        solveBtn.textContent = "I solved it ✓";
        solveBtn.classList.remove("solved");
      }
    }
    solveBtn.addEventListener("click", async () => {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) solved.delete(CLUE_NUM);
      else solved.add(CLUE_NUM);
      solveBtn.textContent = "Saving…";
      await window.REMEDY.saveProgress(solved);
      refreshSolve();
    });

    // Sync state from server on load (so multiple devices stay in sync)
    (async () => {
      await window.REMEDY.fetchProgress();
      refreshSolve();
    })();
    refreshSolve();

    // Puzzle-specific code
    
    const GROUPS = [{"label": "Calgary Bridges", "words": ["PEACE", "LOUISE", "CENTRE ST", "LANGEVIN"]}, {"label": "Bow River Spots", "words": ["PRINCES IS", "EAU CLAIRE", "ST PATRICKS IS", "RILEY PARK"]}, {"label": "Beltline Eats", "words": ["PULCINELLA", "WURST", "ANEJO", "NATIVE TONGUES"]}, {"label": "Calgary Towers", "words": ["BOW", "TELUS SKY", "BANKERS HALL", "BRION & EIGHTH"]}];
    const allTiles = [];
    GROUPS.forEach((g, gi) => g.words.forEach(w => allTiles.push({ word: w, group: gi })));
    for (let i = allTiles.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [allTiles[i], allTiles[j]] = [allTiles[j], allTiles[i]]; }
    const grid = document.getElementById("connGrid");
    const status = document.getElementById("connStatus");
    const submitBtn = document.getElementById("connSubmit");
    const clearBtn = document.getElementById("connClear");
    const feedback = document.getElementById("feedback");
    let selected = new Set(); let solvedGroups = 0;
    function render() {
      grid.innerHTML = "";
      for (let gi = 0; gi < GROUPS.length; gi++) {
        if (GROUPS[gi]._solved) {
          const banner = document.createElement("div");
          banner.className = `conn-group-banner solved-${gi+1}`;
          banner.style.gridColumn = "1 / -1";
          banner.style.background = ["#f9d8a3", "#d4e9b0", "#c5d8f3", "#f2b8c6"][gi];
          banner.innerHTML = `<strong>${GROUPS[gi].label}:</strong> ${GROUPS[gi].words.join(" • ")}`;
          grid.appendChild(banner);
        }
      }
      allTiles.forEach((t, idx) => {
        if (GROUPS[t.group]._solved) return;
        const el = document.createElement("div");
        el.className = "conn-tile"; if (selected.has(idx)) el.classList.add("selected");
        el.textContent = t.word;
        el.addEventListener("click", () => { if (selected.has(idx)) selected.delete(idx); else if (selected.size < 4) selected.add(idx); render(); });
        grid.appendChild(el);
      });
      status.textContent = solvedGroups === 4 ? "All groups found!" : `${selected.size}/4 picked · ${solvedGroups}/4 groups solved`;
    }
    submitBtn.addEventListener("click", () => {
      if (selected.size !== 4) { feedback.className = "feedback show wrong"; feedback.textContent = "Pick exactly 4 tiles."; return; }
      const groupsHit = [...selected].map(i => allTiles[i].group);
      const first = groupsHit[0];
      if (groupsHit.every(g => g === first)) {
        GROUPS[first]._solved = true; solvedGroups++; selected.clear();
        feedback.className = "feedback show correct"; feedback.textContent = `${GROUPS[first].label} — correct!`;
        render();
        if (solvedGroups === 4) { feedback.textContent = `All four found! Head to ${"Lougheed House"}.`; }
      } else { feedback.className = "feedback show wrong"; feedback.textContent = "Not a group — try again."; }
    });
    clearBtn.addEventListener("click", () => { selected.clear(); render(); });
    render();

  </script>
</body>
</html>
