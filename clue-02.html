<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1b1f" />
  <title>02 · Five-Letter Foothold</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/remedy-r.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>

  <main class="clue-page">
    <a href="index.html" class="back-link">← Back to clues</a>

    <div class="clue-header">
      <div class="clue-number-large">Clue 02 of 30</div>
      <h1>Five-Letter Foothold</h1>
      <span class="clue-type-pill" style="color: #6dc4ff; border: 1px solid #6dc4ff66; background: #6dc4ff1a;">Wordle Game</span>
    </div>

    
    <div class="puzzle-box center">
      <h2>Guess the 5-letter word</h2>
      <p>Olive = right letter, right spot. Orange = right letter, wrong spot. Dark = not in word. Unlimited guesses.</p>
      <div class="wordle-grid" id="wordleGrid"></div>
      <div class="answer-row" style="justify-content: center;">
        <input type="text" id="wordleInput" class="text-input" maxlength="5" placeholder="5 letters" autocomplete="off" style="text-transform: uppercase; text-align: center; letter-spacing: 0.3em;" />
        <button class="btn btn-orange" id="wordleGuess" type="button">Guess</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    

    <button class="solve-btn" id="solveBtn" type="button">I solved it ✓</button>
  </main>

  <script src="script.js"></script>
  <script>
    const CLUE_NUM = 2;
    const ANSWER = "PARKS";
    const LOCATION = "Central Memorial Park";

    // If no team is set, route home
    if (!window.REMEDY.getTeam()) {
      window.location.href = "index.html";
    }

    const solveBtn = document.getElementById("solveBtn");
    async function refreshSolve() {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) {
        solveBtn.textContent = "Solved ✓ (tap to undo)";
        solveBtn.classList.add("solved");
      } else {
        solveBtn.textContent = "I solved it ✓";
        solveBtn.classList.remove("solved");
      }
    }
    solveBtn.addEventListener("click", async () => {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) solved.delete(CLUE_NUM);
      else solved.add(CLUE_NUM);
      solveBtn.textContent = "Saving…";
      await window.REMEDY.saveProgress(solved);
      refreshSolve();
    });

    // Sync state from server on load (so multiple devices stay in sync)
    (async () => {
      await window.REMEDY.fetchProgress();
      refreshSolve();
    })();
    refreshSolve();

    // Puzzle-specific code
    
    const WORD = ("PARKS").toUpperCase();
    const MAX_ROWS = 12;
    const grid = document.getElementById("wordleGrid");
    const input = document.getElementById("wordleInput");
    const guessBtn = document.getElementById("wordleGuess");
    const feedback = document.getElementById("feedback");
    let row = 0;
    function buildGrid() {
      grid.innerHTML = "";
      for (let r = 0; r < MAX_ROWS; r++)
        for (let c = 0; c < 5; c++) {
          const t = document.createElement("div");
          t.className = "wordle-tile"; t.id = `wt-${r}-${c}`;
          grid.appendChild(t);
        }
    }
    function evaluate(guess) {
      const result = Array(5).fill("absent");
      const target = WORD.split(""); const used = Array(5).fill(false);
      for (let i = 0; i < 5; i++) if (guess[i] === target[i]) { result[i] = "correct"; used[i] = true; }
      for (let i = 0; i < 5; i++) {
        if (result[i] === "correct") continue;
        for (let j = 0; j < 5; j++) if (!used[j] && guess[i] === target[j]) { result[i] = "present"; used[j] = true; break; }
      }
      return result;
    }
    function submitGuess() {
      const guess = input.value.toUpperCase();
      if (guess.length !== 5 || !/^[A-Z]{5}$/.test(guess)) { feedback.className = "feedback show wrong"; feedback.textContent = "Enter 5 letters."; return; }
      if (row >= MAX_ROWS) return;
      const result = evaluate(guess);
      for (let c = 0; c < 5; c++) {
        const tile = document.getElementById(`wt-${row}-${c}`);
        tile.textContent = guess[c]; tile.classList.add("filled", result[c]);
      }
      if (guess === WORD) {
        feedback.className = "feedback show correct";
        feedback.textContent = `Correct! Head to ${"Central Memorial Park"}.`;
        input.disabled = true;
      } else { row++; input.value = ""; input.focus(); }
    }
    guessBtn.addEventListener("click", submitGuess);
    input.addEventListener("keydown", e => { if (e.key === "Enter") submitGuess(); });
    buildGrid();

  </script>
</body>
</html>
