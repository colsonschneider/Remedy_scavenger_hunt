<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1b1f" />
  <title>01 · The Twin-Block Park</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" href="assets/remedy-r.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="topbar" id="topbar"></nav>

  <main class="clue-page">
    <a href="index.html" class="back-link">← Back to clues</a>

    <div class="clue-header">
      <div class="clue-number-large">Clue 01 of 30</div>
      <h1>The Twin-Block Park</h1>
      <span class="clue-type-pill" style="color: #6dc4ff; border: 1px solid #6dc4ff66; background: #6dc4ff1a;">Text Riddle</span>
    </div>

    
    <div class="puzzle-box">
      <div class="riddle-text">
        On the corner where Seventeenth meets Eighth,<br/>
        Two blocks of green, a patch of grace.<br/>
        Patio lunches and shaded trees,<br/>
        A pocket park to put you at ease.<br/>
        <em style="font-size: 0.85rem; color: var(--text-dim); font-style: italic;">— What park am I?</em>
      </div>
      <div class="answer-row">
        <input type="text" id="answerInput" class="text-input" placeholder="Your answer..." autocomplete="off" />
        <button class="btn btn-orange" id="checkBtn" type="button">Check</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
    

    <button class="solve-btn" id="solveBtn" type="button">I solved it ✓</button>
  </main>

  <script src="script.js"></script>
  <script>
    const CLUE_NUM = 1;
    const ANSWER = "Tomkins Park";
    const LOCATION = "Tomkins Park (8 St & 17 Ave SW)";

    // If no team is set, route home
    if (!window.REMEDY.getTeam()) {
      window.location.href = "index.html";
    }

    const solveBtn = document.getElementById("solveBtn");
    async function refreshSolve() {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) {
        solveBtn.textContent = "Solved ✓ (tap to undo)";
        solveBtn.classList.add("solved");
      } else {
        solveBtn.textContent = "I solved it ✓";
        solveBtn.classList.remove("solved");
      }
    }
    solveBtn.addEventListener("click", async () => {
      const solved = window.REMEDY.loadProgress();
      if (solved.has(CLUE_NUM)) solved.delete(CLUE_NUM);
      else solved.add(CLUE_NUM);
      solveBtn.textContent = "Saving…";
      await window.REMEDY.saveProgress(solved);
      refreshSolve();
    });

    // Sync state from server on load (so multiple devices stay in sync)
    (async () => {
      await window.REMEDY.fetchProgress();
      refreshSolve();
    })();
    refreshSolve();

    // Puzzle-specific code
    
    const checkBtn = document.getElementById("checkBtn");
    const answerInput = document.getElementById("answerInput");
    const feedback = document.getElementById("feedback");
    const norm = s => (s || "").replace(/[^A-Za-z0-9]/g, "").toLowerCase();
    function check() {
      if (!answerInput.value.trim()) return;
      if (norm(answerInput.value) === norm("Tomkins Park")) {
        feedback.className = "feedback show correct";
        feedback.textContent = `Correct! Head to ${"Tomkins Park (8 St & 17 Ave SW)"}.`;
      } else {
        feedback.className = "feedback show wrong";
        feedback.textContent = "Not quite. Try again.";
      }
    }
    checkBtn.addEventListener("click", check);
    answerInput.addEventListener("keydown", e => { if (e.key === "Enter") check(); });

  </script>
</body>
</html>
